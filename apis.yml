name: Spring Batch 5.1
description: >-
  Spring Batch 5.1 is the latest major release of the enterprise batch processing framework for the Spring ecosystem,
  providing reusable functions for processing large volumes of data including logging, transaction management, job
  processing statistics, job restart, skip, and resource management. Version 5.1 introduces Micrometer-based metrics,
  virtual thread support, and enhanced chunk-oriented processing with improved fault tolerance.
