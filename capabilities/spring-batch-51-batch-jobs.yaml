naftiko: 1.0.0-alpha2
info:
  label: Spring Batch 5.1 Actuator API — Batch Jobs
  description: 'Spring Batch 5.1 Actuator API — Batch Jobs. 4 operations. Lead operation: List Batch Jobs. Self-contained
    Naftiko capability covering one Spring Batch 5 1 business surface.'
  tags:
  - Spring Batch 5 1
  - Batch Jobs
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SPRING_BATCH_5_1_API_KEY: SPRING_BATCH_5_1_API_KEY
capability:
  consumes:
  - type: http
    namespace: spring-batch-51-batch-jobs
    baseUri: http://localhost:8080/actuator
    description: Spring Batch 5.1 Actuator API — Batch Jobs business capability. Self-contained, no shared references.
    resources:
    - name: batch-jobs
      path: /batch/jobs
      operations:
      - name: listbatchjobs
        method: GET
        description: List Batch Jobs
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: batch-jobs-jobName
      path: /batch/jobs/{jobName}
      operations:
      - name: getbatchjob
        method: GET
        description: Get Batch Job Details
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: jobName
          in: path
          type: string
          description: Name of the batch job
          required: true
    - name: batch-jobs-jobName-executions
      path: /batch/jobs/{jobName}/executions
      operations:
      - name: listjobexecutions
        method: GET
        description: List Job Executions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: jobName
          in: path
          type: string
          description: Name of the batch job
          required: true
        - name: page
          in: query
          type: integer
          description: Page number (zero-based)
        - name: size
          in: query
          type: integer
          description: Number of executions per page
    - name: batch-jobs-jobName-instances
      path: /batch/jobs/{jobName}/instances
      operations:
      - name: listjobinstances
        method: GET
        description: List Job Instances
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: jobName
          in: path
          type: string
          description: Name of the batch job
          required: true
        - name: page
          in: query
          type: integer
        - name: size
          in: query
          type: integer
