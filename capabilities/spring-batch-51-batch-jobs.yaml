      call: spring-batch-51-batch-jobs.listjobexecutions
      with:
        jobName: tools.jobName
        page: tools.page
        size: tools.size
      outputParameters:
      - type: object
        mapping: $.
    - name: list-job-instances
      description: List Job Instances
      hints:
        readOnly: true
        destructive: false
