      description: List Batch Jobs
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: spring-batch-51-batch-jobs.listbatchjobs
      outputParameters:
      - type: object
        mapping: $.
    - name: get-batch-job-details
      description: Get Batch Job Details
